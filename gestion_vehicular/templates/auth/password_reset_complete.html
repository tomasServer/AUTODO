<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AUTODO | Contraseña Cambiada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a1628; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #ffffff; padding: 35px 30px; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); width: 380px; max-width: 90%; text-align: center; }
        .login-box h1 { color: #0a1628; margin-bottom: 15px; font-size: 1.5rem; }
        .login-box p { color: #5a6a7a; font-size: 0.9rem; margin-bottom: 20px; }
        .login-box a { display: inline-block; padding: 10px 20px; background: #0a1628; color: white; text-decoration: none; border-radius: 4px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>¡Contraseña Cambiada!</h1>
        <p>Tu contraseña ha sido restablecida exitosamente. Ya puedes iniciar sesión.</p>
        <a href="{% url 'login' %}">Iniciar Sesión</a>
    </div>
</body>
</html>
