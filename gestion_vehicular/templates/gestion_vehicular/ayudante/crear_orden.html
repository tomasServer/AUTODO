{% extends 'gestion_vehicular/ayudante/base_ayudante.html' %}
{% block title %}Nueva Orden{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<style>
    .select2-container { min-width: 0 !important; }
    .select2-container--default .select2-selection--single {
        height: 38px;
        border: 1px solid #bdc3c7;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        line-height: 36px;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 36px;
    }
</style>
{% endblock %}

{% block content %}

<h2>Nueva Orden de Trabajo</h2>

<div class="card">
    <form method="POST" id="ordenForm" autocomplete="off">
        {% csrf_token %}

        <!-- FILA 1: Placa + Cliente + Teléfono -->
        <div class="grid grid-3">
            <div>
                <label>Placa *</label>
                <input type="text" name="placa" id="placa" required maxlength="8" 
                       style="text-transform:uppercase;" oninput="validarPlaca(this)" 
                       value="{{ placa|default:'' }}">
            </div>
            <div>
                <label>Cliente *</label>
                <input type="text" name="cliente_nombre" id="cliente_nombre" maxlength="100" required
                       oninput="validarNombre(this)" placeholder="Nombre del cliente...">
            </div>
            <div>
                <label>Teléfono *</label>
                <input type="tel" name="cliente_telefono" id="cliente_telefono" maxlength="8" required
                       oninput="validarTelefono(this)" placeholder="Ej: 77712345">
            </div>
        </div>

        <!-- FILA 2: Supervisor + Complejidad + Kilometraje + Más datos -->
        <div class="grid grid-4 mt-10">
            <div>
                <label>Encargado de Revisión *</label>
                <select name="supervisor_id" id="supervisor_id" required>
                    <option value="">Seleccione...</option>
                    {% for sup in supervisores %}
                    <option value="{{ sup.id }}">{{ sup.nombre_completo }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Complejidad *</label>
                <select name="complejidad_id" id="complejidad_id" required>
                    <option value="">Seleccione...</option>
                    {% for comp in complejidades %}
                    <option value="{{ comp.id }}">{{ comp.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Kilometraje *</label>
                <input type="number" name="kilometraje" id="kilometraje" value="0" min="0" required>
            </div>
            <div style="display:flex; align-items:flex-end;">
                <button type="button" onclick="toggleExtra()" class="btn btn-warning btn-sm">+ Más datos</button>
            </div>
        </div>

        <!-- CAMPOS EXTRA -->
        <div id="extra" class="hidden mt-10">
            <div class="grid grid-2">
                <div>
                    <label>Año del Vehículo</label>
                    <input type="number" name="anio" min="1950" max="2026">
                </div>
                <div>
                    <label>Color</label>
                    <input type="text" name="color" maxlength="30">
                </div>
                <div>
                    <label>VIN (Chasis)</label>
                    <input type="text" name="vin" maxlength="17" style="text-transform:uppercase;" 
                           oninput="this.value = this.value.toUpperCase()">
                </div>
                <div>
                    <label>Observaciones</label>
                    <textarea name="observacion" rows="2" maxlength="500"></textarea>
                </div>
            </div>
        </div>

        <!-- SERVICIOS -->
        <div class="mt-20">
            <label>Servicios</label>
            <small class="text-muted" style="display:block; margin-bottom:5px; font-size:0.75rem;">
                Solo servicios rápidos (menos de 30 minutos)
            </small>
            <div id="serviciosAdicionales"></div>
            <button type="button" onclick="agregarServicio()" class="btn btn-primary btn-sm mt-10">+ Agregar Servicio</button>
        </div>

        <!-- INSUMOS -->
        <div class="mt-20">
            <label>Insumos</label>
            <div id="productosAdicionales"></div>
            <button type="button" onclick="agregarProducto()" class="btn btn-primary btn-sm mt-10">+ Agregar Insumo</button>
        </div>

        <!-- TOTAL -->
        <div class="mt-20">
            <div class="flex-between" style="padding:15px; background:#fef9e7; border-radius:4px;">
                <strong>Total:</strong>
                <strong id="totalCotizacion" style="font-size:1.3rem;">Bs. 0.00</strong>
            </div>
        </div>

        <!-- BOTONES -->
        <div class="flex mt-20" style="justify-content:flex-end;">
            <button type="button" onclick="cancelarVisita()" class="btn btn-danger">Guardar y Salir</button>
            <button type="submit" class="btn btn-primary btn-lg">Crear Orden</button>
        </div>
    </form>
</div>

<!-- ============ SCRIPTS ============ -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    var contadorServicios = 0;
    var contadorProductos = 0;

    // ============ VALIDACIONES ============
    function validarPlaca(input) {
        input.value = input.value.toUpperCase();
        input.value = input.value.replace(/[^A-Z0-9]/g, '');
        if (input.value.length > 8) input.value = input.value.slice(0, 8);
    }

    function validarTelefono(input) {
        input.value = input.value.replace(/[^0-9]/g, '');
        if (input.value.length > 8) input.value = input.value.slice(0, 8);
    }

    function validarNombre(input) {
        input.value = input.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        if (input.value.length > 100) input.value = input.value.slice(0, 100);
    }

    // ============ MOSTRAR/OCULTAR EXTRA ============
    function toggleExtra() {
        var extra = document.getElementById('extra');
        var btn = event.target;
        if (extra.classList.contains('hidden')) {
            extra.classList.remove('hidden');
            btn.textContent = '- Menos datos';
        } else {
            extra.classList.add('hidden');
            btn.textContent = '+ Más datos';
        }
    }

    // ============ GUARDAR Y SALIR ============
    function cancelarVisita() {
        if (confirm('¿El cliente se va sin reparar? Se guardará como cancelada.')) {
            document.getElementById('ordenForm').action = "{% url 'cancelar_visita' %}";
            document.getElementById('ordenForm').submit();
        }
    }

    // ============ AGREGAR SERVICIO ============
    function agregarServicio() {
        contadorServicios++;
        var div = document.createElement('div');
        div.className = 'flex';
        div.style.marginTop = '8px';
        div.innerHTML = `
            <select name="servicio_id_${contadorServicios}" class="servicio-select" style="flex:2; min-width:150px;">
                <option value="">Seleccione servicio...</option>
                {% for s in servicios %}
                <option value="{{ s.id }}" data-precio="{{ s.precio_mano_obra }}">{{ s.nombre }} - Bs. {{ s.precio_mano_obra }}</option>
                {% endfor %}
            </select>
            <input type="number" name="precio_servicio_${contadorServicios}" step="0.01" value="0.00" placeholder="Precio" style="width:110px;">
            <select name="mecanico_${contadorServicios}" class="mecanico-select" style="flex:1; min-width:120px;">
                <option value="">Mecánico...</option>
                {% for mec in mecanicos %}
                <option value="{{ mec.id }}">{{ mec.nombre_completo }}</option>
                {% endfor %}
            </select>
            <button type="button" class="btn btn-danger btn-sm">Quitar</button>
        `;
        document.getElementById('serviciosAdicionales').appendChild(div);
        
        // ✅ Select2 en servicio
        $(div).find('.servicio-select').select2({
            placeholder: 'Buscar servicio...',
            allowClear: true,
            width: '100%'
        });
        
        $(div).find('.servicio-select').on('change', function() {
            var precio = $(this).find('option:selected').data('precio') || '0';
            $(div).find('input[type="number"]').val(precio);
            actualizarTotal();
        });
        
        $(div).find('input[type="number"]').on('input', actualizarTotal);
        $(div).find('button').on('click', function() {
            $(div).remove();
            actualizarTotal();
        });
    }

    // ============ AGREGAR INSUMO ============
    function agregarProducto() {
        contadorProductos++;
        var div = document.createElement('div');
        div.className = 'flex';
        div.style.marginTop = '8px';
        div.innerHTML = `
            <select name="producto_id_${contadorProductos}" class="producto-select" style="flex:2; min-width:150px;">
                <option value="">Seleccione insumo...</option>
                {% for p in productos %}
                <option value="{{ p.id }}" data-precio="{{ p.precio_venta }}">{{ p.nombre }} - Bs. {{ p.precio_venta }}</option>
                {% endfor %}
            </select>
            <input type="number" name="cantidad_${contadorProductos}" value="1" min="1" placeholder="Cant." style="width:70px;">
            <input type="number" name="precio_producto_${contadorProductos}" step="0.01" value="0.00" placeholder="Precio" style="width:110px;">
            <button type="button" class="btn btn-danger btn-sm">Quitar</button>
        `;
        document.getElementById('productosAdicionales').appendChild(div);
        
        // ✅ Select2 en insumo
        $(div).find('.producto-select').select2({
            placeholder: 'Buscar insumo...',
            allowClear: true,
            width: '100%'
        });
        
        $(div).find('.producto-select').on('change', function() {
            var precio = $(this).find('option:selected').data('precio') || '0';
            $(div).find('input[type="number"]').eq(1).val(precio);
            actualizarTotal();
        });
        
        $(div).find('input[type="number"]').on('input', actualizarTotal);
        $(div).find('button').on('click', function() {
            $(div).remove();
            actualizarTotal();
        });
    }

    // ============ CALCULAR TOTAL ============
    function actualizarTotal() {
        var total = 0;
        
        $('input[name^="precio_servicio_"]').each(function() {
            total += parseFloat($(this).val()) || 0;
        });
        
        $('input[name^="precio_producto_"]').each(function() {
            var num = $(this).attr('name').split('_').pop();
            var cantidad = $(`input[name="cantidad_${num}"]`);
            var cant = cantidad.length ? (parseFloat(cantidad.val()) || 0) : 0;
            total += (parseFloat($(this).val()) || 0) * cant;
        });
        
        document.getElementById('totalCotizacion').textContent = 'Bs. ' + total.toFixed(2);
    }

    // ============ VALIDAR ANTES DE ENVIAR ============
    document.getElementById('ordenForm').addEventListener('submit', function(e) {
        var placa = document.getElementById('placa');
        if (!placa.value.trim()) {
            e.preventDefault();
            alert('⚠️ La placa es obligatoria.');
            placa.focus();
            return;
        }
        
        var cliente = document.getElementById('cliente_nombre');
        if (!cliente.value.trim()) {
            e.preventDefault();
            alert('⚠️ El nombre del cliente es obligatorio.');
            cliente.focus();
            return;
        }
        
        var telefono = document.getElementById('cliente_telefono');
        if (!telefono.value.trim()) {
            e.preventDefault();
            alert('⚠️ El teléfono del cliente es obligatorio.');
            telefono.focus();
            return;
        }
        
        var supervisor = document.getElementById('supervisor_id');
        if (!supervisor.value) {
            e.preventDefault();
            alert('⚠️ Debe seleccionar un Encargado de Revisión.');
            supervisor.focus();
            return;
        }
        
        var complejidad = document.getElementById('complejidad_id');
        if (!complejidad.value) {
            e.preventDefault();
            alert('⚠️ Debe seleccionar una Complejidad.');
            complejidad.focus();
            return;
        }
        
        var kilometraje = document.getElementById('kilometraje');
        if (!kilometraje.value || kilometraje.value === '') {
            e.preventDefault();
            alert('⚠️ El kilometraje es obligatorio.');
            kilometraje.focus();
            return;
        }
    });
</script>

{% endblock %}
