{% extends 'gestion_vehicular/ayudante/base_ayudante.html' %}
{% block title %}Nueva Orden{% endblock %}

{% block content %}
<h2 style="color:#1a252f; margin-bottom:15px;">Nueva Orden de Trabajo</h2>

<div class="card" style="padding:20px;">
    <form method="POST" action="{% url 'crear_orden' %}">
        {% csrf_token %}
        
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:10px;">
            <div>
                <label>Placa *</label>
                <input type="text" name="placa" required style="text-transform:uppercase;">
            </div>
            <div>
                <label>Cliente</label>
                <input type="text" name="cliente_nombre" placeholder="Opcional...">
            </div>
            <div>
                <label>Teléfono</label>
                <input type="tel" name="cliente_telefono" placeholder="Opcional...">
            </div>
        </div>
        
        <!-- SERVICIO PRINCIPAL -->
        <div style="display:grid; grid-template-columns:1fr 0.8fr 1fr; gap:12px; margin-bottom:10px;">
            <div>
                <label>Servicio (solo trabajos rapidos)</label>
                <select name="servicio" id="servicio" onchange="actualizarPrecio()">
                    <option value="">Seleccione...</option>
                    {% for s in servicios %}
                    <option value="{{ s.id }}" data-precio="{{ s.precio_mano_obra }}">{{ s.nombre }} - Bs. {{ s.precio_mano_obra }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Precio</label>
                <input type="number" name="precio_manual" id="precio_manual" step="0.01" value="0.00" oninput="actualizarTotal()">
            </div>
            <div>
                <label>Complejidad</label>
                <select name="complejidad">
                    <option value="">Seleccione...</option>
                    <option value="1">Rapido</option>
                    <option value="2">Normal</option>
                </select>
            </div>
        </div>
        
        <!-- SERVICIOS ADICIONALES -->
        <div style="margin-bottom:10px;">
            <label>Servicios Adicionales (opcional)</label>
            <div id="serviciosAdicionales">
                <div style="display:grid; grid-template-columns:1fr 0.5fr auto; gap:8px; margin-bottom:5px;">
                    <select name="servicio_adicional_1" onchange="actualizarPrecioAdicional(this, 1)">
                        <option value="">Seleccione servicio adicional...</option>
                        {% for s in servicios %}
                        <option value="{{ s.id }}" data-precio="{{ s.precio_mano_obra }}">{{ s.nombre }} - Bs. {{ s.precio_mano_obra }}</option>
                        {% endfor %}
                    </select>
                    <input type="number" name="precio_adicional_1" step="0.01" value="0.00" placeholder="Precio" oninput="actualizarTotal()">
                    <button type="button" onclick="eliminarServicio(this)" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">X</button>
                </div>
            </div>
            <button type="button" onclick="agregarServicio()" style="background:#2980b9; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; margin-top:5px;">+ Agregar Servicio</button>
        </div>
        
        <!-- PRODUCTOS -->
        <div style="margin-bottom:10px; margin-top:15px;">
            <label>Productos a Utilizar (opcional)</label>
            <div id="productosAdicionales">
                <div style="display:grid; grid-template-columns:1fr 0.3fr 0.5fr auto; gap:8px; margin-bottom:5px;">
                    <select name="producto_1" onchange="actualizarPrecioProducto(this, 1)">
                        <option value="">Seleccione producto...</option>
                        {% for p in productos %}
                        <option value="{{ p.id }}" data-precio="{{ p.precio_venta }}">{{ p.nombre }} - Bs. {{ p.precio_venta }}</option>
                        {% endfor %}
                    </select>
                    <input type="number" name="cantidad_1" value="1" min="1" oninput="actualizarTotal()">
                    <input type="number" name="precio_producto_1" step="0.01" value="0.00" placeholder="Precio" oninput="actualizarTotal()">
                    <button type="button" onclick="eliminarProducto(this)" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">X</button>
                </div>
            </div>
            <button type="button" onclick="agregarProducto()" style="background:#2980b9; color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; margin-top:5px;">+ Agregar Producto</button>
        </div>
        
        <!-- TOTAL -->
        <div style="margin-top:15px; padding:15px; background:#fef9e7; border-radius:4px; border-left:4px solid #e67e22;">
            <div style="display:flex; justify-content:space-between; font-size:1.2rem;">
                <span>Total:</span>
                <span><strong id="totalCotizacion">Bs. 0.00</strong></span>
            </div>
        </div>
        
        <div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
            <a href="{% url 'modo_taller' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Crear Orden</button>
        </div>
    </form>
</div>

<script>
    var contadorServicios = 1;
    var contadorProductos = 1;

    function actualizarPrecio() {
        var select = document.getElementById('servicio');
        var precioInput = document.getElementById('precio_manual');
        var selected = select.options[select.selectedIndex];
        if (selected.value) {
            precioInput.value = selected.getAttribute('data-precio');
        }
        actualizarTotal();
    }

    function agregarServicio() {
        contadorServicios++;
        var div = document.createElement('div');
        div.style.cssText = 'display:grid; grid-template-columns:1fr 0.5fr auto; gap:8px; margin-bottom:5px;';
        div.innerHTML = `
            <select name="servicio_adicional_${contadorServicios}">
                <option value="">Seleccione servicio adicional...</option>
                {% for s in servicios %}
                <option value="{{ s.id }}" data-precio="{{ s.precio_mano_obra }}">{{ s.nombre }} - Bs. {{ s.precio_mano_obra }}</option>
                {% endfor %}
            </select>
            <input type="number" name="precio_adicional_${contadorServicios}" step="0.01" value="0.00" placeholder="Precio">
            <button type="button" onclick="eliminarServicio(this)" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">X</button>
        `;
        document.getElementById('serviciosAdicionales').appendChild(div);
        
        div.querySelector('select').addEventListener('change', function() {
            var precio = this.options[this.selectedIndex].getAttribute('data-precio') || '0';
            div.querySelector('input[type="number"]').value = precio;
            actualizarTotal();
        });
        div.querySelector('input[type="number"]').addEventListener('input', actualizarTotal);
        div.querySelector('button').addEventListener('click', function() {
            eliminarServicio(this);
        });
    }

    function agregarProducto() {
        contadorProductos++;
        var div = document.createElement('div');
        div.style.cssText = 'display:grid; grid-template-columns:1fr 0.3fr 0.5fr auto; gap:8px; margin-bottom:5px;';
        div.innerHTML = `
            <select name="producto_${contadorProductos}">
                <option value="">Seleccione producto...</option>
                {% for p in productos %}
                <option value="{{ p.id }}" data-precio="{{ p.precio_venta }}">{{ p.nombre }} - Bs. {{ p.precio_venta }}</option>
                {% endfor %}
            </select>
            <input type="number" name="cantidad_${contadorProductos}" value="1" min="1">
            <input type="number" name="precio_producto_${contadorProductos}" step="0.01" value="0.00">
            <button type="button" onclick="eliminarProducto(this)" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">X</button>
        `;
        document.getElementById('productosAdicionales').appendChild(div);
        
        div.querySelector('select').addEventListener('change', function() {
            var precio = this.options[this.selectedIndex].getAttribute('data-precio') || '0';
            div.querySelectorAll('input[type="number"]')[1].value = precio;
            actualizarTotal();
        });
        div.querySelectorAll('input[type="number"]').forEach(function(input) {
            input.addEventListener('input', actualizarTotal);
        });
        div.querySelector('button').addEventListener('click', function() {
            eliminarProducto(this);
        });
    }

    function eliminarServicio(btn) {
        btn.closest('div').remove();
        actualizarTotal();
    }

    function eliminarProducto(btn) {
        btn.closest('div').remove();
        actualizarTotal();
    }

    function actualizarPrecioAdicional(select, num) {
        var precio = select.options[select.selectedIndex].getAttribute('data-precio') || '0';
        var input = document.querySelector(`input[name="precio_adicional_${num}"]`);
        if (input) input.value = precio;
        actualizarTotal();
    }

    function actualizarPrecioProducto(select, num) {
        var precio = select.options[select.selectedIndex].getAttribute('data-precio') || '0';
        var input = document.querySelector(`input[name="precio_producto_${num}"]`);
        if (input) input.value = precio;
        actualizarTotal();
    }

    function actualizarTotal() {
        var total = 0;
        var precioPrincipal = parseFloat(document.getElementById('precio_manual').value) || 0;
        total += precioPrincipal;
        
        document.querySelectorAll('input[name^="precio_adicional_"]').forEach(function(input) {
            total += parseFloat(input.value) || 0;
        });
        
        document.querySelectorAll('input[name^="precio_producto_"]').forEach(function(input) {
            var num = input.name.split('_').pop();
            var cantidad = document.querySelector(`input[name="cantidad_${num}"]`);
            var cant = cantidad ? (parseFloat(cantidad.value) || 0) : 0;
            total += (parseFloat(input.value) || 0) * cant;
        });
        
        document.getElementById('totalCotizacion').textContent = 'Bs. ' + total.toFixed(2);
    }
</script>
{% endblock %}
