{% extends 'gestion_vehicular/jefe_mecanico/base_jefe.html' %}
{% block title %}Revision Tecnica{% endblock %}

{% block content %}
<h2 style="color:#1a252f; margin-bottom:15px;">Revision Tecnica</h2>

<div class="card" style="padding:20px;">
    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom:15px;">
            <label>Tipo de Revision:</label>
            <select name="tipo_revision" style="width:auto;">
                <option value="COMPLETA">Completa</option>
                <option value="RAPIDA">Rapida</option>
            </select>
        </div>
        
        {% for c in componentes %}
        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px; border-bottom:1px solid #ecf0f1;">
            <span style="font-weight:600;">{{ c.nombre }}</span>
            <div style="display:flex; gap:8px;">
                <label style="font-size:0.8rem; margin:0;">
                    <input type="radio" name="comp_{{ c.id }}" value="OK" checked> OK
                </label>
                <label style="font-size:0.8rem; margin:0;">
                    <input type="radio" name="comp_{{ c.id }}" value="REGULAR"> REGULAR
                </label>
                <label style="font-size:0.8rem; margin:0;">
                    <input type="radio" name="comp_{{ c.id }}" value="CRITICO"> CRITICO
                </label>
            </div>
        </div>
        {% endfor %}
        
        <div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
            <a href="{% url 'detalle_orden' orden.id %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar Revision</button>
        </div>
    </form>
</div>
{% endblock %}
