{% extends 'gestion_vehicular/admin/base_admin.html' %}
{% block title %}Editar Usuario{% endblock %}



{% block content %}
<h1 style="color:#1a252f; margin-bottom:20px;">Editar: {{ usuario.usuario_login }}</h1>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="grid grid-1">
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ usuario.nombre }}" required>
            </div>
            <div>
                <label>Apellido</label>
                <input type="text" name="apellido" value="{{ usuario.apellido|default:'' }}">
            </div>
        </div>
        
        <div class="grid grid-2" style="margin-top:15px;">
            <div>
                <label>Usuario</label>
                <input type="text" value="{{ usuario.usuario_login }}" disabled>
                <small style="color:#7f8c8d;">El usuario no se puede cambiar</small>
            </div>
            <div>
                <label>Cambiar contraseña</label>
                <input type="password" name="password" placeholder="••••••">
            </div>
        </div>
        
        <div class="grid grid-1" style="margin-top:15px;">
            <div>
                <label>Rol</label>
                <select name="rol_id" required>
                    {% for rol in roles %}
                    <option value="{{ rol.id }}" {% if rol.id == usuario.id_rol_id %}selected{% endif %}>{{ rol.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Telefono</label>
                <input type="text" name="telefono" value="{{ usuario.telefono|default:'' }}">
            </div>
        </div>
        
        <div style="margin-top:15px;">
            <label>
                <input type="checkbox" name="activo" {% if usuario.activo %}checked{% endif %}>
                Usuario activo
            </label>
        </div>
        
        <div style="text-align:right; margin-top:20px;">
            <a href="{% url 'lista_usuarios' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Actualizar Usuario</button>
        </div>
    </form>
</div>
{% endblock %}
