{% extends 'gestion_vehicular/admin/base_admin.html' %}
{% block title %}Editar Usuario{% endblock %}

{% block content %}
<h1 style="color: var(--primary-dark); font-size: 1.5rem; margin-bottom: 20px;">Editar: {{ usuario.usuario_login }}</h1>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        
        <!-- Fila 1: Nombre y Apellido -->
        <div class="grid grid-2">
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ usuario.nombre }}" required>
            </div>
            <div>
                <label>Apellido</label>
                <input type="text" name="apellido" value="{{ usuario.apellido|default:'' }}">
            </div>
        </div>
        
        <!-- Fila 2: CI y Teléfono -->
        <div class="grid grid-2" style="margin-top:15px;">
            <div>
                <label>Carnet de Identidad (CI)</label>
                <input type="text" name="ci" value="{{ usuario.ci|default:'' }}" placeholder="Ej: 12345678">
            </div>
            <div>
                <label>Teléfono</label>
                <input type="text" name="telefono" value="{{ usuario.telefono|default:'' }}">
            </div>
        </div>
        
        <!-- Fila 3: Usuario y Rol -->
        <div class="grid grid-2" style="margin-top:15px;">
            <div>
                <label>Usuario</label>
                <input type="text" value="{{ usuario.usuario_login }}" disabled>
                <small class="text-muted" style="display: block; margin-top: 4px; font-size: 0.75rem;">El nombre de usuario no se puede cambiar.</small>
            </div>
            <div>
                <label>Rol</label>
                <select name="rol_id" required>
                    {% for rol in roles %}
                    <option value="{{ rol.id }}" {% if rol.id == usuario.id_rol_id %}selected{% endif %}>{{ rol.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <!-- Fila 4: Estado Activo -->
        <div style="margin-top:15px; display: flex; align-items: center; padding-top: 10px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0;">
                <input type="checkbox" name="activo" {% if usuario.activo %}checked{% endif %} style="width: auto; margin: 0;">
                Usuario activo
            </label>
        </div>
        
        <div style="text-align:right; margin-top:20px; padding-top: 15px; border-top: 1px solid #f1f5f9;">
            <a href="{% url 'lista_usuarios' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Actualizar Datos</button>
        </div>
    </form>
</div>
{% endblock %}
