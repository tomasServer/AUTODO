{% extends 'gestion_vehicular/admin/base_admin.html' %}
{% block title %}Nuevo Usuario{% endblock %}

{% block content %}

<h1 style="color: var(--primary-dark); font-size: 1.5rem; margin-bottom: 20px;">Agregar Usuario</h1>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        
        <!-- Fila 1: Nombre y Apellido -->
        <div class="grid grid-2">
            <div>
                <label>Nombre *</label>
                <input type="text" name="nombre" required placeholder="Ej: Juan">
            </div>
            <div>
                <label>Apellido</label>
                <input type="text" name="apellido" placeholder="Ej: Pérez">
            </div>
        </div>
        
        <!-- Fila 2: CI y Teléfono -->
        <div class="grid grid-2" style="margin-top:15px;">
            <div>
                <label>Carnet de Identidad (CI)</label>
                <input type="text" name="ci" placeholder="Ej: 12345678">
            </div>
            <div>
                <label>Teléfono</label>
                <input type="text" name="telefono" placeholder="Ej: 77712345">
            </div>
        </div>

        <!-- Fila 3: Correo (Usuario) y Contraseña -->
        <div class="grid grid-2" style="margin-top:15px;">
            <div>
                <label>Correo Electrónico (Usuario) *</label>
                <input type="email" name="usuario_login" required placeholder="ejemplo@correo.com">
                <small class="text-muted" style="display:block; margin-top:4px; font-size:0.75rem;">
                    Este será el correo para iniciar sesión y recuperar contraseña.
                </small>
            </div>
            <div>
                <label>Contraseña *</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
        </div>
        
        <!-- Fila 4: Rol -->
        <div class="grid grid-2" style="margin-top:15px;">
            <div>
                <label>Rol *</label>
                <select name="rol_id" required>
                    <option value="">Seleccione un rol...</option>
                    {% for rol in roles %}
                    <option value="{{ rol.id }}">{{ rol.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <!-- Dejamos este espacio vacío para mantener el balance del grid, o puedes poner otro campo aquí -->
            <div></div>
        </div>
        
        <div style="text-align:right; margin-top:20px; padding-top: 15px; border-top: 1px solid #f1f5f9;">
            <a href="{% url 'lista_usuarios' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Crear Usuario</button>
        </div>
    </form>
</div>

{% endblock %}
