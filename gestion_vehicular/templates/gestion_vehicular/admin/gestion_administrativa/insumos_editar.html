{% extends 'gestion_vehicular/admin/base_admin.html' %}
{% block title %}Editar - {{ producto.nombre }}{% endblock %}


{% block content %}
<h1 style="color:#1a252f; margin-bottom:20px;">Editar: {{ producto.nombre }}</h1>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="grid grid-1">
            <div>
                <label>Codigo</label>
                <input type="text" name="codigo" value="{{ producto.codigo|default:'' }}">
            </div>
            <div>
                <label>Nombre del producto</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" required>
            </div>
        </div>
        
        <label style="margin-top:15px;">Descripcion</label>
        <textarea name="descripcion" rows="2">{{ producto.descripcion|default:'' }}</textarea>
        
        <div class="grid grid-3" style="margin-top:15px;">
            <div>
                <label>Costo Unitario (Bs.)</label>
                <input type="number" name="costo_unitario" value="{{ producto.costo_unitario }}" required>
            </div>
            <div>
                <label>Precio de Venta (Bs.)</label>
                <input type="number" name="precio_venta" step="0.01" value="{{ producto.precio_venta }}" required>
            </div>
            <div>
                <label>Stock Actual</label>
                <input type="number" name="stock_actual" value="{{ producto.stock_actual }}">
            </div>
        </div>
        
        <div style="text-align:right; margin-top:20px;">
            <a href="{% url 'lista_insumos' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Actualizar Producto</button>
        </div>
    </form>
</div>
{% endblock %}
