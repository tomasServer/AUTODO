{% extends 'gestion_vehicular/admin/base_admin.html' %}
{% block title %}Agregar Producto{% endblock %}

{% block content %}
<h1 style="color:#1a252f; margin-bottom:20px;">Agregar Producto al Inventario</h1>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="grid grid-2">
            <div>
                <label>Codigo</label>
                <input type="text" name="codigo" placeholder="Ej: ACE-MIN">
            </div>
            <div>
                <label>Nombre del producto</label>
                <input type="text" name="nombre" required>
            </div>
        </div>
        
        <label style="margin-top:15px;">Descripcion</label>
        <textarea name="descripcion" rows="2" placeholder="Descripcion opcional..."></textarea>
        
        <div class="grid grid-3" style="margin-top:15px;">
            <div>
                <label>Costo Unitario (Bs.)</label>
                <input type="number" name="costo_unitario" step="0.01" required>
            </div>
            <div>
                <label>Precio de Venta (Bs.)</label>
                <input type="number" name="precio_venta" step="0.01" required>
            </div>
            <div>
                <label>Stock Inicial</label>
                <input type="number" name="stock_actual" value="0">
            </div>
        </div>
        
        <div style="text-align:right; margin-top:20px;">
            <a href="{% url 'lista_insumos' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar Producto</button>
        </div>
    </form>
</div>
{% endblock %}
