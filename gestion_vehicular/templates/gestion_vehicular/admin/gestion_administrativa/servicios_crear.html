
{% extends 'gestion_vehicular/base.html' %}
{% block title %}Agregar Servicio{% endblock %}

{% block navbar %}
    <a href="{% url 'dashboard_admin' %}">Inicio</a>
    <a href="{% url 'lista_servicios' %}">Servicios</a>
{% endblock %}

{% block sidebar %}
    <h3>Acciones</h3>
    <a href="{% url 'lista_servicios' %}">Ver Servicios</a>
{% endblock %}

{% block content %}
<h1 style="color:#1a252f; margin-bottom:20px;">Agregar Servicio</h1>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="grid grid-2">
            <div>
                <label>Tipo de Servicio</label>
                <select name="tipo_servicio" required>
                    <option value="">Seleccione...</option>
                    {% for tipo in tipos %}
                    <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Nombre del Servicio</label>
                <input type="text" name="nombre" required placeholder="Ej: Cambio de aceite de motor">
            </div>
        </div>
        
        <label style="margin-top:15px;">Descripcion</label>
        <textarea name="descripcion" rows="2" placeholder="Descripcion opcional..."></textarea>
        
        <div class="grid grid-3" style="margin-top:15px;">
            <div>
                <label>Costo Mano de Obra (Bs.)</label>
                <input type="number" name="costo_mano_obra" step="0.01" required>
            </div>
            <div>
                <label>Precio de Venta (Bs.)</label>
                <input type="number" name="precio_mano_obra" step="0.01" required>
            </div>
            <div>
                <label>Tiempo Estimado (minutos)</label>
                <input type="number" name="tiempo_estimado_minutos" placeholder="30">
            </div>
        </div>
        
        <div style="text-align:right; margin-top:20px;">
            <a href="{% url 'lista_servicios' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar Servicio</button>
        </div>
    </form>
</div>
{% endblock %}
