{% extends 'gestion_vehicular/admin/base_admin.html' %}
{% block title %}Revision Rapida{% endblock %}

{% block content %}
<h2 style="color:#1a252f; margin-bottom:15px;">Revision Rapida</h2>

<div class="card" style="padding:20px;">
    <p style="margin-bottom:15px;">Placa: <strong style="text-transform:uppercase;">{{ placa }}</strong></p>
    
    <form method="POST" action="{% url 'guardar_revision_rapida' %}">
        {% csrf_token %}
        <input type="hidden" name="placa" value="{{ placa }}">
        
        {% for componente in componentes %}
        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px; border-bottom:1px solid #ecf0f1;">
            <span style="font-weight:600;">{{ componente.nombre }}</span>
            <div style="display:flex; gap:8px;">
                <label style="font-size:0.8rem; margin:0;">
                    <input type="radio" name="comp_{{ componente.id }}" value="OK" checked> OK
                </label>
                <label style="font-size:0.8rem; margin:0;">
                    <input type="radio" name="comp_{{ componente.id }}" value="REGULAR"> REGULAR
                </label>
                <label style="font-size:0.8rem; margin:0;">
                    <input type="radio" name="comp_{{ componente.id }}" value="CRITICO"> CRITICO
                </label>
            </div>
        </div>
        {% endfor %}
        
        <div style="display:flex; justify-content:space-between; margin-top:15px;">
            <a href="{% url 'buscar_vehiculo' %}" class="btn btn-gray">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar Revision</button>
        </div>
    </form>
</div>
{% endblock %}
