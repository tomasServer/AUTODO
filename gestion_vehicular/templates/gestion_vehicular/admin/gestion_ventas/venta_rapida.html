{% extends 'gestion_vehicular/admin/base_admin.html' %}
{% block title %}Venta Rápida{% endblock %}

{% block content %}

<h1 style="color: var(--primary-dark); font-size: 1.5rem; margin-bottom: 20px;">Venta Rápida de Productos</h1>

<div class="card">
    <form method="POST" action="{% url 'guardar_venta_rapida' %}" id="ventaForm">
        {% csrf_token %}
        <input type="hidden" name="metodo_pago" id="metodo_pago_hidden" value="EFECTIVO">

        <!-- BUSCADOR DE PRODUCTOS -->
        <div style="margin-bottom: 20px; padding: 15px; background: #f1f5f9; border-radius: 8px; border: 1px solid #e2e8f0;">
            <label style="font-weight: 600; color: var(--primary-dark); margin-bottom: 8px; display: block;">🔍 Buscar Producto</label>
            <input type="text" id="buscador_principal" placeholder="Ej: aceite, filtro..." autocomplete="off" style="width: 100%;">
        </div>

        <!-- LISTA DE PRODUCTOS FILTRADOS -->
        <div id="lista_productos" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; display: none;">
            <!-- Aquí JavaScript inyectará los productos -->
        </div>

        <!-- PRODUCTOS AGREGADOS -->
        <div style="margin-bottom: 10px;">
            <h4 style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600; margin-bottom: 10px;">Productos agregados:</h4>
            <div id="carritoVenta" style="margin-bottom: 20px;">
                <!-- Las filas se agregan dinámicamente aquí -->
            </div>
        </div>

        <!-- TOTAL -->
        <div style="padding:15px; background:#f1f5f9; border-radius:8px; border-left:4px solid var(--primary-dark);">
            <div class="flex-between" style="font-size:1.2rem;">
                <span style="font-weight: 600; color: var(--primary-dark);">Total:</span>
                <strong id="totalVenta" style="color: var(--primary-dark);">Bs. 0.00</strong>
            </div>
        </div>

        <!-- BOTÓN -->
        <div class="flex flex-wrap" style="margin-top:20px; justify-content:flex-end;">
            <button type="button" onclick="abrirModalCliente()" class="btn btn-success btn-lg">Registrar Venta</button>
        </div>
    </form>
</div>

<!-- ====== MODAL PARA DATOS DEL CLIENTE ====== -->
<div id="modalCliente" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#fff; padding:25px; border-radius:12px; max-width:500px; width:90%; box-shadow:0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;">
        <h3 style="margin:0 0 15px 0; color:var(--primary-dark);">Datos del Cliente</h3>

        <div style="margin-bottom:15px; position:relative;">
            <label>🔍 Buscar cliente</label>
            <input type="text" id="buscador_cliente" placeholder="Nombre, teléfono o CI..." autocomplete="off" oninput="buscarClienteLocal(this.value)">
            <div id="resultados_busqueda" style="display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #cbd5e1; border-radius:0 0 8px 8px; max-height:200px; overflow-y:auto; z-index:10002; box-shadow:0 4px 6px rgba(0,0,0,0.1);"></div>
        </div>

        <hr style="border:none; border-top:1px solid #e2e8f0; margin:15px 0;">

        <div style="margin-bottom:12px;"><label>Nombre *</label><input type="text" id="cliente_nombre" maxlength="30" required></div>
        <div style="margin-bottom:12px;"><label>Apellido *</label><input type="text" id="cliente_apellido" maxlength="30" required></div>
        <div style="margin-bottom:12px;"><label>Teléfono *</label><input type="tel" id="cliente_telefono" maxlength="8" required></div>
        <div style="margin-bottom:15px;">
            <label>CI * <small id="ci-helper" style="color:#64748b; font-weight:normal; font-size:0.75rem;"></small></label>
            <input type="text" id="cliente_ci" maxlength="14" placeholder="Ej: 1234567-1A" oninput="validarCI(this)" required>
        </div>
        <div style="margin-bottom:20px;">
            <label>Método de Pago *</label>
            <select id="metodo_pago" required>
                <option value="EFECTIVO">💵 Efectivo</option>
                <option value="QR">📱 QR</option>
                <option value="TRANSFERENCIA">🏦 Transferencia</option>
            </select>
        </div>

        <div class="flex flex-wrap" style="justify-content:flex-end;">
            <button type="button" onclick="cerrarModalCliente()" class="btn btn-gray">Cancelar</button>
            <button type="button" onclick="ventaSinRegistrar()" class="btn btn-warning">Sin Registrar</button>
            <button type="button" onclick="confirmarVenta()" class="btn btn-success">Confirmar</button>
        </div>
    </div>
</div>

<script>
    // ============ VARIABLES GLOBALES ============
    var contadorVentas = 0;
    var PRODUCTOS_DATA = [
        {% for p in productos %}
        { id: {{ p.id }}, nombre: "{{ p.nombre|escapejs }}", codigo: "{{ p.codigo|default:''|escapejs }}", precio: "{{ p.precio_venta|default:0 }}", stock: "{{ p.stock_actual|default:0 }}" }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    var CLIENTES = [
        {% for c in clientes %}
        { id: {{ c.id }}, nombre: "{{ c.nombre|escapejs }}", apellido: "{{ c.apellido|default:''|escapejs }}", telefono: "{{ c.telefono|default:''|escapejs }}", ci: "{{ c.ci|default:''|escapejs }}" }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    // ============ LÓGICA DEL BUSCADOR PRINCIPAL ============
    document.getElementById('buscador_principal').addEventListener('input', function() {
        var filtro = this.value.toLowerCase().trim();
        var contenedor = document.getElementById('lista_productos');
        
        if (filtro.length < 2) {
            contenedor.style.display = 'none';
            return;
        }

        var encontrados = PRODUCTOS_DATA.filter(function(p) {
            return p.nombre.toLowerCase().includes(filtro) || p.codigo.toLowerCase().includes(filtro);
        });

        if (encontrados.length === 0) {
            contenedor.innerHTML = '<div style="padding:15px; color:#64748b;">No se encontraron productos.</div>';
            contenedor.style.display = 'block';
            return;
        }

        var html = '';
        encontrados.forEach(function(p) {
            html += `
                <div onclick="seleccionarProducto(${p.id})" style="padding:10px 15px; border-bottom:1px solid #e2e8f0; cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">
                    <strong>${p.nombre}</strong> ${p.codigo ? '('+p.codigo+')' : ''} 
                    <span style="float:right; color:var(--accent-color); font-weight:bold;">Bs. ${p.precio} | Stock: ${p.stock}</span>
                </div>
            `;
        });
        contenedor.innerHTML = html;
        contenedor.style.display = 'block';
    });

    // Ocultar la lista si hace clic fuera
    document.addEventListener('click', function(e) {
        var contenedor = document.getElementById('lista_productos');
        var input = document.getElementById('buscador_principal');
        if (!contenedor.contains(e.target) && e.target !== input) {
            contenedor.style.display = 'none';
        }
    });

    // ============ AGREGAR PRODUCTO AL CARRITO ============
    function seleccionarProducto(id) {
        var p = PRODUCTOS_DATA.find(function(x) { return x.id === id; });
        if (!p) return;

        document.getElementById('lista_productos').style.display = 'none';
        document.getElementById('buscador_principal').value = '';
        
        contadorVentas++;
        var div = document.createElement('div');
        div.id = 'fila-producto-' + contadorVentas;
        
        // Asegurarnos de que el precio sea un número válido
        var precioNum = parseFloat(p.precio) || 0;
        
        div.style.cssText = 'display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:10px; margin-bottom:10px; align-items:center; background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;';
        
        // 🆕 Agregamos data-stock al div para usarlo en la validación
        div.innerHTML = `
            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                <strong>${p.nombre}</strong>
                <input type="hidden" name="producto_${contadorVentas}" value="${p.id}" data-stock="${p.stock}">
            </div>
            <input type="number" name="cantidad_${contadorVentas}" value="1" min="1" oninput="actualizarTotalVenta()" style="margin:0;">
            <input type="number" name="precio_producto_${contadorVentas}" step="0.01" value="${precioNum.toFixed(2)}" oninput="actualizarTotalVenta()" style="margin:0;">
            <button type="button" onclick="eliminarVenta(this)" class="btn btn-danger btn-sm" style="margin:0;">X</button>
        `;
        
        document.getElementById('carritoVenta').appendChild(div);
        actualizarTotalVenta();
    }

    function eliminarVenta(btn) { 
        btn.closest('div[id^="fila-producto"]').remove(); 
        actualizarTotalVenta(); 
    }

    function actualizarTotalVenta() {
        var total = 0;
        document.querySelectorAll('input[name^="precio_producto_"]').forEach(function(input) {
            var num = input.name.split('_').pop();
            var cantidad = document.querySelector(`input[name="cantidad_${num}"]`);
            var cant = cantidad ? (parseFloat(cantidad.value) || 0) : 0;
            total += (parseFloat(input.value) || 0) * cant;
        });
        document.getElementById('totalVenta').textContent = 'Bs. ' + total.toFixed(2);
    }

    // ============ CLIENTES ============
    function validarCI(input) {
        let val = input.value.toUpperCase();
        const partes = val.split('-');
        if (partes.length > 2) {
            val = partes[0] + '-' + partes.slice(1).join('');
            partes.length = 0;
            partes.push(...val.split('-'));
        }
        let numeros = partes[0].replace(/[^0-9]/g, '');
        let complemento = partes[1] !== undefined ? partes[1].replace(/[^A-Z0-9]/g, '') : null;
        if (numeros.length > 11) numeros = numeros.slice(0, 11);
        if (complemento && complemento.length > 2) complemento = complemento.slice(0, 2);
        input.value = complemento !== null ? numeros + '-' + complemento : numeros;

        const helper = document.getElementById('ci-helper');
        if (!helper) return;
        if (input.value.length === 0) helper.textContent = '';
        else if (/^[0-9]{7,11}(-[A-Z0-9]{1,2})?$/.test(input.value)) {
            helper.textContent = '✓'; helper.style.color = 'var(--success)'; helper.style.fontWeight = 'bold';
        } else {
            helper.textContent = '⚠️'; helper.style.color = 'var(--warning)'; helper.style.fontWeight = 'bold';
        }
    }

    function buscarClienteLocal(termino) {
        var div = document.getElementById('resultados_busqueda');
        var t = termino.toLowerCase().trim();
        if (t.length < 2) { div.style.display = 'none'; return; }

        var encontrados = CLIENTES.filter(function(c) {
            return c.nombre.toLowerCase().includes(t) || (c.apellido && c.apellido.toLowerCase().includes(t)) ||
                   c.telefono.toLowerCase().includes(t) || c.ci.toLowerCase().includes(t);
        }).slice(0, 10);

        if (encontrados.length === 0) {
            div.innerHTML = '<div style="padding:10px; color:#64748b; font-size:0.85rem;">Sin resultados</div>';
            div.style.display = 'block'; return;
        }

        var html = '';
        encontrados.forEach(function(c) {
            var nombreCompleto = c.nombre + (c.apellido ? ' ' + c.apellido : '');
            html += `<div onclick="seleccionarCliente(${c.id})" style="padding:10px 12px; cursor:pointer; border-bottom:1px solid #e2e8f0; font-size:0.85rem;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'"><strong>${nombreCompleto}</strong>${c.telefono ? ' · ' + c.telefono : ''}${c.ci ? ' · ' + c.ci : ''}</div>`;
        });
        div.innerHTML = html;
        div.style.display = 'block';
    }

    function seleccionarCliente(id) {
        var c = CLIENTES.find(function(x) { return x.id === id; });
        if (!c) return;
        document.getElementById('cliente_nombre').value = c.nombre;
        document.getElementById('cliente_apellido').value = c.apellido || '';
        document.getElementById('cliente_telefono').value = c.telefono;
        document.getElementById('cliente_ci').value = c.ci;
        validarCI(document.getElementById('cliente_ci'));
        document.getElementById('resultados_busqueda').style.display = 'none';
        document.getElementById('buscador_cliente').value = '';
    }

    document.addEventListener('click', function(e) {
        var b = document.getElementById('buscador_cliente');
        var r = document.getElementById('resultados_busqueda');
        if (b && r && !b.contains(e.target) && !r.contains(e.target)) r.style.display = 'none';
    });

    // ============ MODAL ============
    function abrirModalCliente() {
        var hayProducto = document.querySelectorAll('input[name^="producto_"]').length > 0;
        if (!hayProducto) { alert('Agrega al menos un producto.'); return; }

        // 🆕 VALIDACIÓN DE STOCK AL ABRIR EL MODAL
        let stockValido = true;
        document.querySelectorAll('input[name^="producto_"]').forEach(function(input) {
            const num = input.name.split('_').pop();
            const cantidadInput = document.querySelector(`input[name="cantidad_${num}"]`);
            const cantidad = parseInt(cantidadInput.value) || 0;
            const stockDisponible = parseInt(input.getAttribute('data-stock')) || 0;

            if (cantidad > stockDisponible) {
                stockValido = false;
                alert(`⚠️ No hay suficiente stock del producto seleccionado.\nStock disponible: ${stockDisponible}\nIntentas vender: ${cantidad}`);
                cantidadInput.focus();
                cantidadInput.style.border = '2px solid var(--danger)';
            } else {
                cantidadInput.style.border = '';
            }
        });

        if (!stockValido) return;

        document.getElementById('cliente_nombre').value = '';
        document.getElementById('cliente_apellido').value = '';
        document.getElementById('cliente_telefono').value = '';
        document.getElementById('cliente_ci').value = '';
        document.getElementById('buscador_cliente').value = '';
        document.getElementById('resultados_busqueda').style.display = 'none';
        document.getElementById('metodo_pago').value = 'EFECTIVO';

        var helperCI = document.getElementById('ci-helper');
        if (helperCI) helperCI.textContent = '';

        document.getElementById('modalCliente').style.display = 'flex';
    }

    function cerrarModalCliente() { document.getElementById('modalCliente').style.display = 'none'; }

    function copiarMetodoPago() {
        var metodo = document.getElementById('metodo_pago').value || 'EFECTIVO';
        document.getElementById('metodo_pago_hidden').value = metodo;
    }

    function ventaSinRegistrar() {
        if (confirm('¿Continuar sin registrar cliente?')) {
            var form = document.getElementById('ventaForm');
            form.querySelectorAll('input[name="cliente_nombre"], input[name="cliente_apellido"], input[name="cliente_telefono"], input[name="cliente_ci"], input[name="sin_registrar"]').forEach(function(i) { i.remove(); });
            var i = document.createElement('input'); i.type = 'hidden'; i.name = 'sin_registrar'; i.value = 'true'; form.appendChild(i);
            copiarMetodoPago();
            cerrarModalCliente();
            form.submit();
        }
    }

    function confirmarVenta() {
        var nombre = document.getElementById('cliente_nombre').value.trim();
        var apellido = document.getElementById('cliente_apellido').value.trim();
        var telefono = document.getElementById('cliente_telefono').value.trim();
        var ci = document.getElementById('cliente_ci').value.trim();

        var faltantes = [];
        if (!nombre) faltantes.push('Nombre');
        if (!apellido) faltantes.push('Apellido');
        if (!telefono) faltantes.push('Teléfono');
        if (!ci) faltantes.push('CI');

        if (faltantes.length > 0) {
            alert('⚠️ Para registrar al cliente debes llenar todos los campos.\n\nFaltan:\n• ' + faltantes.join('\n• ') + '\n\nSi no quieres registrar los datos, usa el botón "Sin Registrar".');
            return;
        }

        if (!/^[0-9]{8}$/.test(telefono)) {
            alert('⚠️ El teléfono debe tener exactamente 8 dígitos.');
            document.getElementById('cliente_telefono').focus(); return;
        }

        if (!/^[0-9]{7,11}(-[A-Z0-9]{1,2})?$/.test(ci.toUpperCase())) {
            alert('⚠️ El CI no tiene un formato válido.\n\n• Debe tener entre 7 y 11 dígitos.\n• Opcionalmente: guion y hasta 2 letras/números.\n\nEjemplos: 1234567, 12345678, 12345678901, 1234567-1A');
            document.getElementById('cliente_ci').focus(); return;
        }

        // 🆕 VALIDACIÓN DE STOCK ANTES DE CONFIRMAR
        let stockValido = true;
        document.querySelectorAll('input[name^="producto_"]').forEach(function(input) {
            const num = input.name.split('_').pop();
            const cantidadInput = document.querySelector(`input[name="cantidad_${num}"]`);
            const cantidad = parseInt(cantidadInput.value) || 0;
            const stockDisponible = parseInt(input.getAttribute('data-stock')) || 0;

            if (cantidad > stockDisponible) {
                stockValido = false;
                alert(`⚠️ No hay suficiente stock del producto seleccionado.\nStock disponible: ${stockDisponible}\nIntentas vender: ${cantidad}`);
                cantidadInput.focus();
                cantidadInput.style.border = '2px solid var(--danger)';
            } else {
                cantidadInput.style.border = '';
            }
        });

        if (!stockValido) return;

        var form = document.getElementById('ventaForm');
        form.querySelectorAll('input[name="cliente_nombre"], input[name="cliente_apellido"], input[name="cliente_telefono"], input[name="cliente_ci"], input[name="sin_registrar"]').forEach(function(i) { i.remove(); });

        var inpNombre = document.createElement('input'); inpNombre.type = 'hidden'; inpNombre.name = 'cliente_nombre'; inpNombre.value = nombre; form.appendChild(inpNombre);
        var inpApellido = document.createElement('input'); inpApellido.type = 'hidden'; inpApellido.name = 'cliente_apellido'; inpApellido.value = apellido; form.appendChild(inpApellido);
        var inpTel = document.createElement('input'); inpTel.type = 'hidden'; inpTel.name = 'cliente_telefono'; inpTel.value = telefono; form.appendChild(inpTel);
        var inpCi = document.createElement('input'); inpCi.type = 'hidden'; inpCi.name = 'cliente_ci'; inpCi.value = ci.toUpperCase(); form.appendChild(inpCi);

        copiarMetodoPago();
        cerrarModalCliente();
        form.submit();
    }

    window.onclick = function(event) {
        var modal = document.getElementById('modalCliente');
        if (event.target == modal) modal.style.display = 'none';
    }
</script>

{% endblock %}
