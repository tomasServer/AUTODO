<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTODO | Ingresar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0a1628; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-box {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            width: 380px;
            max-width: 90%;
        }
        .login-box h1 { text-align: center; color: #0a1628; margin-bottom: 5px; font-size: 1.5rem; }
        .login-box p { text-align: center; color: #5a6a7a; margin-bottom: 25px; }
        .login-box label { display: block; margin-bottom: 4px; color: #2d3748; font-weight: 600; font-size: 0.9rem; }
        .login-box input {
            width: 100%; padding: 10px 12px; margin-bottom: 15px;
            border: 1px solid #c0c8d0; border-radius: 4px; font-size: 0.95rem;
        }
        .login-box input:focus { border-color: #2c5f8a; outline: none; }
        .login-box button {
            width: 100%; padding: 12px; background: #0a1628; color: #ffffff;
            border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .login-box button:hover { background: #1a3a5c; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; border-left: 0px solid #a83232; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; border-left: 0px solid #2d6a4f; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>AUTODO</h1>
        <p>Taller Automotriz</p>
        
        {% if messages %}
            {% for m in messages %}
            <div class="{% if m.tags == 'error' %}error{% else %}success{% endif %}">{{ m }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <label>Usuario</label>
            <input type="text" name="username" required>
            
            <label>Contrasena</label>
            <input type="password" name="password" required>
            
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
